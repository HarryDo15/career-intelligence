name: Schema foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://career:career_local@localhost:5432/career
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
