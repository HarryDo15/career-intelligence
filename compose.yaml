services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career_local
      POSTGRES_DB: career
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - career_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  career_data:
